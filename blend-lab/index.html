function pointerPoint(e){ const p=e.touches?e.touches[0]:e; return {x:p.clientX,y:p.clientY}; }
function distance(t){ const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
function onDown(e){
  if(e.touches?.length===2){ pinchStart={d:distance(e.touches),z:state.zoom}; return; }
  const p=pointerPoint(e); dragging=true; dragStart=p; startObj=JSON.parse(JSON.stringify(state.object)); stage.classList.add('dragging');
}
function onMove(e){
  if(e.touches?.length===2 && pinchStart){ e.preventDefault(); state.zoom=clamp(pinchStart.z*distance(e.touches)/pinchStart.d,.55,1.8); updateCube(); return; }
  if(!dragging) return; e.preventDefault(); const p=pointerPoint(e), dx=p.x-dragStart.x,dy=p.y-dragStart.y;
  if(state.tool==='select'){ state.viewRotY += dx*.28; state.viewRotX -= dy*.24; dragStart=p; }
  if(state.tool==='move'){ state.object.x=startObj.x+dx/70; state.object.y=startObj.y-dy/70; }
  if(state.tool==='rotate'){ state.object.ry=startObj.ry+dx*.55; state.object.rx=startObj.rx-dy*.55; }
  if(state.tool==='scale'){ state.object.scale=clamp(startObj.scale-dy/130,.35,2.2); }
  if(state.tool==='extrude'){ state.object.extrude=clamp(startObj.extrude-dy/120,.55,2.2); }
  updateCube();
}
function onUp(){ if(dragging){dragging=false; stage.classList.remove('dragging'); save();} pinchStart=null; }

stage.addEventListener('touchstart',e=>{ if(e.touches.length===2) onDown(e); },{passive:false}); stage.addEventListener('touchmove',e=>{ if(e.touches.length===2) onMove(e); },{passive:false}); stage.addEventListener('touchend',e=>{ if(pinchStart) onUp(e); });
stage.addEventListener('wheel',e=>{e.preventDefault(); state.zoom=clamp(state.zoom-e.deltaY*.001,.55,1.8); updateCube();save();},{passive:false});

$$('.side-tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#zoomIn').onclick=()=>{state.zoom=clamp(state.zoom+.12,.55,1.8);updateCube();save();};

$('#resetView').onclick=()=>{state.viewRotX=-12;state.viewRotY=26;state.zoom=1;updateCube();save();toast('視点をリセット');};

['px','py','rx','ry','sc'].forEach(id=>$('#'+id).addEventListener('change',()=>{state.object.x=+$('#px').value;state.object.y=+$('#py').value;state.object.rx=+$('#rx').value;state.object.ry=+$('#ry').value;state.object.scale=clamp(+$('#sc').value,.3,2.5);updateCube();save();}));

  if(!a||!b){toast('0Fと60Fの両方にKEYを保存してください');return;}
  playing=true;$('#playBtn').textContent='Ⅱ'; const start=performance.now();
  const animate=(now)=>{ if(!playing)return; const t=clamp((now-start)/2200,0,1), ease=t*t*(3-2*t); setFrame(t*60);
    ['x','y','rx','ry','rz','scale','extrude'].forEach(k=>state.object[k]=lerp(a[k],b[k],ease));
    state.object.color=t<.5?a.color:b.color; updateCube();
    if(t<1) playRAF=requestAnimationFrame(animate); else {stopPlay();toast('アニメーション再生完了');}
  }; playRAF=requestAnimationFrame(animate);
};

$('#coachNext').onclick=nextCoach; $('#coachClose').onclick=()=>coach.classList.add('hidden');
$('#helpBtn').onclick=()=>{coach.classList.remove('hidden');updateCoach();};
$('#courseClose').onclick=()=>$('#courseOverlay').classList.add('hidden');
$('[data-action="home"]').onclick=()=>{$('#courseOverlay').classList.remove('hidden');renderLessons();};
$$('.mobile-nav button').forEach(b=>b.onclick=()=>{
  $$('.mobile-nav button').forEach(x=>x.classList.toggle('active',x===b));
  if(b.dataset.mobile==='lessons') $('#courseOverlay').classList.remove('hidden');
  if(b.dataset.mobile==='props'){setTab('properties');$('#sidePanel').classList.add('mobile-open');}
  if(b.dataset.mobile==='sim') $('#sidePanel').classList.remove('mobile-open');
});
$('#sceneWrap').addEventListener('click',()=>{ if(window.innerWidth<760) $('#sidePanel').classList.remove('mobile-open'); });

// Tutorial target interactions may advance when the intended action is performed.
function maybeAdvance(target){ const l=lessons[state.lesson],st=l?.steps[state.step]; if(st && st[0]===target) setTimeout(nextCoach,220); }
$('#viewportPanel').addEventListener('click',e=>{ if(e.target.closest('.tool,.zoom-controls,.viewport-toolbar'))return; maybeAdvance('viewport'); });
$('.tree-row.active').onclick=()=>{toast('Cubeを選択');maybeAdvance('outliner');};
$('[data-tab="properties"]').addEventListener('click',()=>maybeAdvance('properties'));
$('#timeline').addEventListener('click',()=>maybeAdvance('timeline'));
stage.addEventListener('pointerup',()=>{ if(state.tool==='select')maybeAdvance('orbit'); if(state.tool==='move')maybeAdvance('moveAction'); if(state.tool==='rotate')maybeAdvance('rotateAction'); if(state.tool==='scale')maybeAdvance('scaleAction'); if(state.tool==='extrude')maybeAdvance('extrudeAction'); });
$$('.tool').forEach(b=>b.addEventListener('click',()=>maybeAdvance(b.dataset.tool)));
$('#objectModeBtn').addEventListener('click',()=>{if(state.editMode)maybeAdvance('edit')});
$$('.swatches button').forEach(b=>b.addEventListener('click',()=>maybeAdvance('material')));
$('#frameSlider').addEventListener('change',()=>{if(state.frame===0)maybeAdvance('frame0'); if(state.frame===60)maybeAdvance('frame60');});
$('#keyBtn').addEventListener('click',()=>maybeAdvance(state.frame===0?'key0':'key60'));
$('#playBtn').addEventListener('click',()=>maybeAdvance('play'));

window.addEventListener('keydown',e=>{
  const map={g:'move',r:'rotate',s:'scale',e:'extrude'}; if(map[e.key.toLowerCase()]){state.tool=map[e.key.toLowerCase()];updateTool();save();toast(`${labelFor(state.tool)} (${e.key.toUpperCase()})`);}
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

// Restore UI
if(state.keys[0]) $('#keyDot0').classList.add('active'); if(state.keys[60]) $('#keyDot60').classList.add('active');
$('#objectModeBtn').textContent=state.editMode?'Edit Mode':'Object Mode';$('#objectModeBtn').classList.toggle('edit',state.editMode);
$$('.swatches button').forEach(b=>b.classList.toggle('active',b.dataset.color===state.object.color));
renderLessons(); updateMode(); updateTool(); updateCube(); setFrame(state.frame); updateCoach();

// First visit: show course briefly? Keep simulator immediately usable, coach on.
if(!localStorage.getItem('blendLabVisited')){ localStorage.setItem('blendLabVisited','1'); setTimeout(()=>toast('Cubeを指で触ってみよう'),500); }

    </script>
  </body>
